<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>建信（北京）投资基金管理有限责任公司投资图谱</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft Yahei", sans-serif;
            background: #121212;
            color: #ffffff;
        }
        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 15px auto;
            color: #4285F4;
            display: block;
        }
        #graph-container {
            width: 100%;
            height: 800px;
            border: 1px solid #333;
            background: #1e1e1e;
        }
        .detail-panel {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2d2d2d;
            color: #ffffff;
            display: none;
        }
        .detail-panel h3 {
            margin-top: 0;
            color: #ffffff;
            font-size: 16px;
        }
        .detail-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .detail-panel table th, .detail-panel table td {
            border: 1px solid #444;
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
            color: #ffffff;
        }
        .detail-panel table th {
            background-color: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="page-title">建信（北京）投资基金管理有限责任公司投资图谱</div>
    <div id="graph-container"></div>
    <div class="detail-panel" id="detailPanel">
        <h3 id="detailTitle"></h3>
        <div id="detailContent"></div>
    </div>

    <script>
        const myChart = echarts.init(document.getElementById('graph-container'));

        // 节点大小标准
        const CORE_SIZE = 70;       // 红球大小
        const FUND_SIZE = 42;       // 蓝球 = 70 * 3/5
        const COMPANY_SIZE = 35;    // 绿球 = 70 * 1/2

        // 基金数据（根据PDF中的详细出资信息更新）
        const fundDetails = [
            {
                id: 'fund1',
                name: '陕西建兴湛卢股权投资\n(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2026/2/11\n\n注册资本：\n30000.00万人民币\n\n出资方及出资情况：\n• 中兴通讯股份有限公司：出资1.17亿元（39%）\n• 陕西省科技创新母基金：出资6000万元（20%）\n• 陕西源杰半导体：出资3000万元（10%）\n• 矽力杰半导体技术：出资3000万元（10%）\n• 无锡高新区创投：出资3000万元（10%）\n• 深圳垣华投资：出资3000万元（10%）\n• 建信(北京)投资基金：出资300万元（1%）\n\n经营状态：\n存续\n\n投资领域：\n新一代信息技术产业、新能源、人工智能、先进制造领域`
            },
            {
                id: 'fund2',
                name: '徐州建兴高新新兴产业创业投资基金\n(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2025/9/17\n\n注册资本：\n100000.00万人民币\n\n出资方及出资情况：\n• 建信(北京)投资基金管理有限责任公司（GP）\n• 建信(北京)投资基金管理有限责任公司(委派代表 陈迪)\n\n经营状态：\n存续\n\n投资领域：\n高新新兴产业`
            },
            {
                id: 'fund3',
                name: '厦门嘉庚建新创业投资基金\n(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/12/31\n\n注册资本：\n10100.00万人民币\n\n出资方及出资情况：\n• 具体出资方信息暂未公开\n\n经营状态：\n存续\n\n投资领域：\n创业投资`
            },
            {
                id: 'fund4',
                name: '建新星元绿色创业投资基金\n(常州)合伙企业(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/12/3\n\n注册资本：\n160000.00万人民币\n\n出资方及出资情况：\n• 建信(北京)投资基金管理有限责任公司（主要出资方）\n\n经营状态：\n存续\n\n投资领域：\n绿色创业投资`
            },
            {
                id: 'fund5',
                name: '山西低空经济和通用航空业股权投资\n(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/9/2\n\n注册资本：\n150200.00万人民币\n\n出资方及出资情况：\n• 中合盛资本管理有限公司\n• 建信(北京)投资基金管理有限责任公司\n\n经营状态：\n存续\n\n投资领域：\n低空经济和通用航空业`
            },
            {
                id: 'fund6',
                name: '丽水建鑫信瑞创业投资基金\n(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/9/2\n\n注册资本：\n200000.00万人民币\n\n出资方及出资情况：\n• 建信(北京)投资基金管理有限责任公司（主要出资方）\n\n经营状态：\n存续\n\n投资领域：\n浙江省"415X"先进制造业专项基金，截至2025年1月，已有首批重大储备项目20个`
            },
            {
                id: 'fund7',
                name: '成都东部新区交子建鑫智能智造\n股权投资基金(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/3/29\n\n注册资本：\n30000.00万人民币\n\n出资方及出资情况：\n• 建信(北京)投资基金管理有限责任公司（主要出资方）\n\n经营状态：\n存续\n\n投资领域：\n高端装备制造、电子信息、智能网联汽车等产业领域，总规模10亿元，首期规模3亿元`
            },
            {
                id: 'fund8',
                name: '天津联信私募不动产股权\n投资基金(有限合伙)',
                category: 1,
                symbolSize: FUND_SIZE,
                tooltipDetail: `成立日期：\n2024/2/28\n\n注册资本：\n60000.00万人民币\n\n出资方及出资情况：\n• 建信(北京)投资基金管理有限责任公司（主要出资方）\n\n经营状态：\n注销\n\n投资领域：\n不动产股权投资`
            }
        ];

        // 根据PDF文档，丽水建鑫有20个储备项目，创建两个代表性节点
        const companyDetails = [
            {
                id: 'c1', 
                name: '丽水建鑫储备项目A', 
                category: 2, 
                symbolSize: COMPANY_SIZE,
                tooltipDetail: `所属领域：\n浙江省"415X"先进制造业\n\n项目状态：\n重大储备项目\n\n投资阶段：\n储备阶段\n\n备注：\n作为丽水建鑫信瑞创业投资基金20个重大储备项目之一`
            },
            {
                id: 'c2', 
                name: '丽水建鑫储备项目B', 
                category: 2, 
                symbolSize: COMPANY_SIZE,
                tooltipDetail: `所属领域：\n浙江省"415X"先进制造业\n\n项目状态：\n重大储备项目\n\n投资阶段：\n储备阶段\n\n备注：\n作为丽水建鑫信瑞创业投资基金20个重大储备项目之一`
            }
        ];

        const data = {
            nodes: [
                // 核心节点：图例=私募基金管理人，节点显示全称
                {
                    id: 'core',
                    name: '建信（北京）投资基金管理有限责任公司',
                    category: 0,
                    symbolSize: CORE_SIZE,
                    detail: `
                        <table>
                            <tr><th>主体类型</th><td>私募基金管理人</td></tr>
                            <tr><th>管理规模</th><td>100亿以上（具体未知）</td></tr>
                        </table>
                    `,
                    tooltipDetail: `主体类型：\n私募基金管理人\n\n管理规模：\n100亿以上（具体未知）`
                },
                ...fundDetails.map(fund => ({
                    ...fund,
                    detail: `<div style="white-space: pre-line">成立日期：\n${fund.tooltipDetail.split('\n\n')[0].split('\n')[1]}\n\n注册资本：\n${fund.tooltipDetail.split('\n\n')[1].split('\n')[1]}\n\n出资方及出资情况：\n${fund.tooltipDetail.split('\n\n')[2].split('\n').slice(1).join('<br/>')}\n\n经营状态：\n${fund.tooltipDetail.split('\n\n')[3].split('\n')[1]}\n\n投资领域：\n${fund.tooltipDetail.split('\n\n')[4] ? fund.tooltipDetail.split('\n\n')[4].split('\n')[1] : '暂无'}</div>`
                })),
                ...companyDetails.map(company => ({
                    ...company,
                    detail: `<div style="white-space: pre-line">所属领域：\n${company.tooltipDetail.split('\n\n')[0].split('\n')[1]}\n\n项目状态：\n${company.tooltipDetail.split('\n\n')[1].split('\n')[1]}\n\n投资阶段：\n${company.tooltipDetail.split('\n\n')[2].split('\n')[1]}\n\n备注：\n${company.tooltipDetail.split('\n\n')[3].split('\n')[1]}</div>`
                }))
            ],
            links: [
                { source: 'core', target: 'fund1' },
                { source: 'core', target: 'fund2' },
                { source: 'core', target: 'fund3' },
                { source: 'core', target: 'fund4' },
                { source: 'core', target: 'fund5' },
                { source: 'core', target: 'fund6' },
                { source: 'core', target: 'fund7' },
                { source: 'core', target: 'fund8' },

                // 连接丽水建鑫到其两个代表性储备项目
                { source: 'fund6', target: 'c1' },
                { source: 'fund6', target: 'c2' }
            ]
        };

        const option = {
            backgroundColor: '#121212',
            tooltip: { 
                trigger: 'item', 
                formatter: function(params) {
                    if (params.dataType === 'edge') {
                        return `${params.data.source} → ${params.data.target}`;
                    }
                    // 在tooltip中也应用换行格式
                    if (params.data && params.data.tooltipDetail) {
                        return params.data.tooltipDetail.replace(/\n/g, '<br/>');
                    }
                    return params.name;
                },
                backgroundColor: '#1e1e1e',
                textStyle: {
                    color: '#42a5f5'
                },
                extraCssText: 'white-space: pre-line;'
            },
            legend: {
                orient: 'vertical', 
                left: '20px', 
                top: 'center',
                data: ['私募基金管理人', '在管基金', '被投企业'],
                textStyle: {
                    color: '#ffffff'
                },
                inactiveColor: '#666666'
            },
            series: [{
                type: 'graph',
                layout: 'force',
                roam: true,
                draggable: true,
                focusNodeAdjacency: true,
                label: { 
                    show: true, 
                    position: 'inside', 
                    fontSize: 11, 
                    color: '#fff',
                    formatter: function(params) {
                        return params.data.name.split('\n').join(' ');
                    }
                },
                force: { 
                    repulsion: 3000, 
                    edgeLength: 180 * (5/7),
                    gravity: 0.1,
                    layoutAnimation: true
                },
                categories: [
                    { 
                        name: '私募基金管理人', 
                        itemStyle: { color: '#e54d42' },
                        emphasis: {
                            itemStyle: { 
                                color: '#ff6b6b',
                                borderColor: '#ffffff',
                                borderWidth: 2
                            }
                        }
                    },
                    { 
                        name: '在管基金', 
                        itemStyle: { color: '#4285F4' },
                        emphasis: {
                            itemStyle: { 
                                color: '#6ab7ff',
                                borderColor: '#ffffff',
                                borderWidth: 2
                            }
                        }
                    },
                    { 
                        name: '被投企业', 
                        itemStyle: { color: '#0F9D58' },
                        emphasis: {
                            itemStyle: { 
                                color: '#42db8c',
                                borderColor: '#ffffff',
                                borderWidth: 2
                            }
                        }
                    }
                ],
                lineStyle: {
                    color: 'source',
                    curveness: 0.1,
                    width: 2
                },
                edgeSymbol: ['none', 'arrow'],
                edgeSymbolSize: [4, 10],
                data: data.nodes,
                links: data.links,
                emphasis: {
                    focus: 'adjacency',
                    lineStyle: {
                        width: 4
                    }
                }
            }]
        };

        myChart.setOption(option);

        // 点击查看详情
        myChart.on('click', function (params) {
            if (params.componentType === 'series' && params.dataType === 'node') {
                const panel = document.getElementById('detailPanel');
                const title = document.getElementById('detailTitle');
                const content = document.getElementById('detailContent');
                
                title.innerText = params.data.name;
                content.innerHTML = params.data.detail;
                panel.style.display = 'block';
            }
        });

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
