<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>建信（北京）投资基金管理有限责任公司投资图谱</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Microsoft Yahei", sans-serif;
            background: #f9f9f9;
        }
        #graph-container {
            width: 100%;
            height: 800px;
            border: 1px solid #eee;
            background: white;
        }
        .detail-panel {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            display: none;
        }
        .detail-panel h3 {
            margin-top: 0;
            color: #222;
            font-size: 16px;
        }
        .detail-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .detail-panel table th, .detail-panel table td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
        }
        .detail-panel table th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div id="graph-container"></div>
    <div class="detail-panel" id="detailPanel">
        <h3 id="detailTitle"></h3>
        <div id="detailContent"></div>
    </div>

    <script>
        const myChart = echarts.init(document.getElementById('graph-container'));

        // 节点大小（明显放大，绝对不会小）
        const CORE_SIZE = 70;     // 红球
        const FUND_SIZE = 55;     // 蓝球（放大！）
        const COMPANY_SIZE = 48;  // 绿球（放大！）

        const data = {
            nodes: [
                // 核心
                {
                    id: 'core',
                    name: '建信（北京）投资基金管理有限责任公司',
                    category: 0,
                    symbolSize: CORE_SIZE,
                    tooltip: '私募基金管理人\n管理规模：100亿以上',
                    detail: `<table><tr><th>主体类型</th><td>私募基金管理人</td></tr><tr><th>管理规模</th><td>100亿以上（具体未知）</td></tr></table>`
                },

                // 蓝球：在管基金
                {
                    id: 'fund1', name: '陕西建兴湛卢股权投资', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：30000万',
                    detail: `<table><tr><th>成立日期</th><td>2026-02-11</td></tr><tr><th>注册资本</th><td>30000.0000万人民币</td></tr><tr><th>出资比例</th><td>1.00%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund2', name: '徐州建兴高新创投基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：100000万',
                    detail: `<table><tr><th>成立日期</th><td>2025-09-17</td></tr><tr><th>注册资本</th><td>100000.0000万人民币</td></tr><tr><th>出资比例</th><td>1.00%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund3', name: '厦门嘉庚建新创投基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：10100万',
                    detail: `<table><tr><th>成立日期</th><td>2024-12-31</td></tr><tr><th>注册资本</th><td>10100.0000万人民币</td></tr><tr><th>出资比例</th><td>0.99%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund4', name: '建新星元绿色创投基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：160000万',
                    detail: `<table><tr><th>成立日期</th><td>2024-12-03</td></tr><tr><th>注册资本</th><td>160000.0000万人民币</td></tr><tr><th>出资比例</th><td>0.50%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund5', name: '山西低空经济股权基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：150200万',
                    detail: `<table><tr><th>成立日期</th><td>2024-09-02</td></tr><tr><th>注册资本</th><td>150200.0000万人民币</td></tr><tr><th>出资比例</th><td>0.07%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund6', name: '丽水建鑫信瑞创投基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：200000万',
                    detail: `<table><tr><th>成立日期</th><td>2024-09-02</td></tr><tr><th>注册资本</th><td>200000.0000万人民币</td></tr><tr><th>出资比例</th><td>1.00%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund7', name: '成都交子建鑫智造股权基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：30000万',
                    detail: `<table><tr><th>成立日期</th><td>2024-03-29</td></tr><tr><th>注册资本</th><td>30000.0000万人民币</td></tr><tr><th>出资比例</th><td>0.33%</td></tr><tr><th>状态</th><td>存续</td></tr></table>`
                },
                {
                    id: 'fund8', name: '天津联信不动产股权基金', category: 1, symbolSize: FUND_SIZE,
                    tooltip: '在管基金 | 注册资本：60000万',
                    detail: `<table><tr><th>成立日期</th><td>2024-02-28</td></tr><tr><th>注册资本</th><td>60000.0000万人民币</td></tr><tr><th>出资比例</th><td>0.83%</td></tr><tr><th>状态</th><td>注销</td></tr></table>`
                },

                // 绿球：被投企业（明显放大）
                {
                    id: 'c1', name: '被投企业1', category: 2, symbolSize: COMPANY_SIZE,
                    tooltip: '新一代信息技术 | 中型企业 | 成长期',
                    detail: `<table><tr><th>公司所属行业</th><td>新一代信息技术</td></tr><tr><th>公司规模</th><td>中型企业</td></tr><tr><th>融资阶段</th><td>成长期</td></tr></table>`
                },
                {
                    id: 'c2', name: '被投企业2', category: 2, symbolSize: COMPANY_SIZE,
                    tooltip: '人工智能 | 中小型企业 | 扩张期',
                    detail: `<table><tr><th>公司所属行业</th><td>人工智能</td></tr><tr><th>公司规模</th><td>中小型企业</td></tr><tr><th>融资阶段</th><td>扩张期</td></tr></table>`
                },
                {
                    id: 'c3', name: '被投企业3', category: 2, symbolSize: COMPANY_SIZE,
                    tooltip: '新能源 | 大型企业 | 成熟期',
                    detail: `<table><tr><th>公司所属行业</th><td>新能源</td></tr><tr><th>公司规模</th><td>大型企业</td></tr><tr><th>融资阶段</th><td>成熟期</td></tr></table>`
                },
                {
                    id: 'c4', name: '被投企业4', category: 2, symbolSize: COMPANY_SIZE,
                    tooltip: '先进制造 | 中型企业 | 成长期',
                    detail: `<table><tr><th>公司所属行业</th><td>先进制造</td></tr><tr><th>公司规模</th><td>中型企业</td></tr><tr><th>融资阶段</th><td>成长期</td></tr></table>`
                },
                {
                    id: 'c5', name: '被投企业5', category: 2, symbolSize: COMPANY_SIZE,
                    tooltip: '半导体/芯片 | 中小型企业 | 初创期',
                    detail: `<table><tr><th>公司所属行业</th><td>半导体/芯片</td></tr><tr><th>公司规模</th><td>中小型企业</td></tr><tr><th>融资阶段</th><td>初创期</td></tr></table>`
                }
            ],
            links: [
                { source: 'core', target: 'fund1' },{ source: 'core', target: 'fund2' },{ source: 'core', target: 'fund3' },{ source: 'core', target: 'fund4' },
                { source: 'core', target: 'fund5' },{ source: 'core', target: 'fund6' },{ source: 'core', target: 'fund7' },{ source: 'core', target: 'fund8' },
                { source: 'fund1', target: 'c1' },{ source: 'fund1', target: 'c2' },{ source: 'fund1', target: 'c3' },{ source: 'fund1', target: 'c4' },{ source: 'fund1', target: 'c5' }
            ]
        };

        const option = {
            tooltip: {
                trigger: 'item',
                formatter: (params) => params.data.tooltip || params.name
            },
            legend: {
                orient: 'vertical', left: '20px', top: 'center',
                data: ['私募基金管理人', '在管基金', '被投企业']
            },
            series: [{
                type: 'graph',
                layout: 'force',
                roam: true,
                label: { show: true, position: 'inside', fontSize: 12, color: '#fff' },
                force: { repulsion: 4000, edgeLength: 220, gravity: 0.1 },
                categories: [
                    { name: '私募基金管理人', itemStyle: { color: '#e54d42' } },
                    { name: '在管基金', itemStyle: { color: '#4285F4' } },
                    { name: '被投企业', itemStyle: { color: '#0F9D58' } }
                ],
                data: data.nodes,
                links: data.links
            }]
        };

        myChart.setOption(option);

        // 点击显示详情
        myChart.on('click', function (params) {
            if (params.componentType === 'series' && params.dataType === 'node') {
                const panel = document.getElementById('detailPanel');
                const title = document.getElementById('detailTitle');
                const content = document.getElementById('detailContent');
                title.innerText = params.data.name;
                content.innerHTML = params.data.detail;
                panel.style.display = 'block';
            }
        });

        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
