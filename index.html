            font-family: "Microsoft Yahei", sans-serif;
        }
        #graph-container {
            width: 100%;
            height: 800px;
            border: 1px solid #eee;
        }
        .detail-panel {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: none;
        }
        .detail-panel h3 {
            margin-top: 0;
            color: #333;
        }
        .detail-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .detail-panel table th, .detail-panel table td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }
        .detail-panel table th {
            background-color: #f5f5f5;
        }

                { source: 'fund1', target: 'c2' },
                { source: 'fund1', target: 'c3' },

            tooltip: { trigger: 'item', formatter: '{b}' },
            legend: {
                orient: 'vertical', left: '20px', top: 'center',
                data: ['私募基金管理人', '在管基金', '被投企业']
            },
            series: [{
                type: 'graph',
                layout: 'force',
                roam: true,
                label: { show: true, position: 'inside', fontSize: 11 },
                force: { repulsion: 2500, edgeLength: 160, gravity: 0.1 },
                categories: [
                    { name: '私募基金管理人', itemStyle: { color: '#e54d42' } },
                    { name: '在管基金', itemStyle: { color: '#4285F4' } },
                    { name: '被投企业', itemStyle: { color: '#0F9D58' } }
                ],
                data: data.nodes,
                links: data.links
            }]
        };

        myChart.setOption(option);

        myChart.on('click', function (params) {
            if (params.dataType === 'node') {
                const panel = document.getElementById('detailPanel');
                document.getElementById('detailTitle').innerText = params.name;
                document.getElementById('detailContent').innerHTML = params.data.detail;
                panel.style.display = 'block';
            }
        });

        window.addEventListener('resize', () => myChart.resize());

</body>
</html>
